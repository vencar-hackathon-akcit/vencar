[project]
name = "vencar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "langchain==1.4.7",
  "langchain-anthropic==1.7.7",
  "langchain-core==1.7.3",
  "langchain-google-genai==4.4.2",
  "langgraph==1.2.19",
  "pillow==13.0.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.33",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "RUF", "D1"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"src/vencar/adapters/agents/prompts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["vencar"]
